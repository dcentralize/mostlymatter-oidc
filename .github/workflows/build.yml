name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "matrix=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        run: |
          echo "version=$(curl -fsSL "https://raw.githubusercontent.com/mattermost/mattermost/v${{ matrix.version }}/server/.go-version")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - run: ./build.sh "${{ matrix.version }}"
        env:
          BUILD_NUMBER: ${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mostlymatter-amd64-v${{ matrix.version }}
          path: dist/*
          if-no-files-found: error

  test:
    name: test ${{ matrix.version }}
    needs: [versions, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mostlymatter-amd64-v${{ matrix.version }}
          path: dist
      - run: chmod +x "dist/mostlymatter-amd64-v${{ matrix.version }}"
      - run: test/e2e.sh "${{ matrix.version }}"

  release:
    if: github.ref == 'refs/heads/main'
    needs: [versions, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.versions.outputs.matrix }}
        run: |
          jq -r '.[].version' <<<"$MATRIX" | while read -r version; do
            tag="v${version}-oidc"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              continue
            fi
            binary="dist/mostlymatter-amd64-v${version}"
            mkdir -p "notice/$version"
            cp "$binary.NOTICE.txt" "notice/$version/NOTICE.txt"
            gh release create "$tag" "$binary" "$binary.sha512" LICENSE "notice/$version/NOTICE.txt" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" \
              --notes "Mostlymatter ${version} with the OpenID Connect login, under AGPL-3.0 (see LICENSE and NOTICE.txt).

          Source: this repository at ${tag}, applied by build.sh to $(cat "$binary.source")."
          done
